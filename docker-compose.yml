# Local infrastructure for kit-sandbox. Values here are for a developer machine only.
name: kit-sandbox

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-not-a-secret}
      POSTGRES_DB: ${POSTGRES_DB:-kit_sandbox}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on the first start with an empty volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
